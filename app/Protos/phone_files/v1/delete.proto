// Wire schema used by Phone Link and Link to Windows.
// Field names and numbers recovered from Link to Windows 1.26082.130.0 and cross-checked against
// Phone Link 1.26072.257.0. Rendered by tools/catalog/render_protos.py from a descriptor set.
syntax = "proto3";

package phone_files.v1;

import "phone_files/v1/status.proto";

message BatchedDeleteRequest {
  string target_uri = 1;
  int64 target_checksum = 2;
}

message BatchedDeleteResponse {
  string target_uri = 1;
  FilesResponseStatus status = 2;
}

message FilesDeleteRequest {
  string target_uri = 1;
  int64 target_checksum = 2;
  bool is_batch = 3;
  repeated BatchedDeleteRequest batch_requests = 4;
}

message FilesDeleteResponse {
  FilesResponseStatus status = 1;
  string target_uri = 2;
  bool is_batch = 3;
  repeated BatchedDeleteResponse batch_responses = 4;
}
