// Wire schema used by Phone Link and Link to Windows.
// Field names and numbers recovered from Link to Windows 1.26082.130.0 and cross-checked against
// Phone Link 1.26072.257.0. Rendered by tools/catalog/render_protos.py from a descriptor set.
syntax = "proto3";

package phone_files.v1;

enum StreamMessageStatus {
  STREAM_MESSAGE_STATUS_UNSPECIFIED = 0;
  STREAM_MESSAGE_STATUS_SUCCESS = 1;
  STREAM_MESSAGE_STATUS_ERROR_FILE_NOT_FOUND = 2;
  STREAM_MESSAGE_STATUS_ERROR_GENERIC = 3;
}

message FilesStreamsMessage {
  string file_uri = 1;
  StreamMessageStatus stream_message_status = 2;
  string content = 3;
}
