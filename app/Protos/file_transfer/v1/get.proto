// Wire schema used by Phone Link and Link to Windows.
// Field names and numbers recovered from Link to Windows 1.26082.130.0 and cross-checked against
// Phone Link 1.26072.257.0. Rendered by tools/catalog/render_protos.py from a descriptor set.
syntax = "proto3";

package file_transfer.v1;

enum FileTransferRequestType {
  FILE_TRANSFER_REQUEST_TYPE_UNSPECIFIED = 0;
  FILE_TRANSFER_REQUEST_TYPE_PERMISSION = 1;
}

enum FileTransferResponseStatus {
  FILE_TRANSFER_RESPONSE_STATUS_UNSPECIFIED = 0;
  FILE_TRANSFER_RESPONSE_STATUS_OK = 1;
  FILE_TRANSFER_RESPONSE_STATUS_FEATURE_NOT_SUPPORT = 2;
  FILE_TRANSFER_RESPONSE_STATUS_INVALID_DEVICE_RESOURCE_REQUEST_TYPE = 3;
  FILE_TRANSFER_RESPONSE_STATUS_UNRECOGNIZED_PAYLOAD = 4;
  FILE_TRANSFER_RESPONSE_STATUS_INVALID_FILE_TRANSFER_REQUEST_TYPE = 5;
  FILE_TRANSFER_RESPONSE_STATUS_MISSING_PERMISSION = 6;
}

message FileTransferRequestMessage {
  FileTransferRequestType request_type = 1;
}

message FileTransferResponseMessage {
  FileTransferResponseStatus status = 1;
}
