// Wire schema used by Phone Link and Link to Windows.
// Field names and numbers recovered from Link to Windows 1.26082.130.0 and cross-checked against
// Phone Link 1.26072.257.0. Rendered by tools/catalog/render_protos.py from a descriptor set.
syntax = "proto3";

package file_transfer.v1;

enum FileShareFileStatus {
  FILE_SHARE_FILE_STATUS_UNSPECIFIED = 0;
  FILE_SHARE_FILE_STATUS_NOT_STARTED = 1;
  FILE_SHARE_FILE_STATUS_IN_PROGRESS = 2;
  FILE_SHARE_FILE_STATUS_COMPLETED = 3;
}

message FileShareContentMessage {
  string file_id = 1;
  string file_name = 2;
  int64 file_size = 3;
  string file_hash = 4;
  FileShareFileStatus file_status = 5;
}

message FileShareMessage {
  string transfer_id = 1;
  string scenario = 2;
  string sender_name = 3;
  int32 received_file_count = 4;
  repeated FileShareContentMessage content = 5;
  string pc_folder = 6;
  int32 session_try_count = 7;
  bool is_concurrent_mode = 8;
}
