// Wire schema used by Phone Link and Link to Windows.
// Field names and numbers recovered from Link to Windows 1.26082.130.0 and cross-checked against
// Phone Link 1.26072.257.0. Rendered by tools/catalog/render_protos.py from a descriptor set.
syntax = "proto3";

package side_channel.v1;

enum SideChannelErrorType {
  SIDE_CHANNEL_ERROR_TYPE_UNSPECIFIED = 0;
  SIDE_CHANNEL_ERROR_TYPE_OTHER_SERVER_ERROR = 1;
  SIDE_CHANNEL_ERROR_TYPE_UNKNOWN_REQUEST_TYPE = 2;
  SIDE_CHANNEL_ERROR_TYPE_SCENARIO_SERVICE_ERROR = 3;
  SIDE_CHANNEL_ERROR_TYPE_CRYPTO_VALIDATION_ERROR = 4;
  SIDE_CHANNEL_ERROR_TYPE_CLIENT_INFO_MISSING = 5;
  SIDE_CHANNEL_ERROR_TYPE_CRYPTO_TRUST_ERROR = 6;
  SIDE_CHANNEL_ERROR_TYPE_CRYPTO_TRUST_TIMEOUT = 7;
}

message SideChannelError {
  SideChannelErrorType type = 1;
  string msg = 2;
}
