// Wire schema used by Phone Link and Link to Windows.
// Field names and numbers recovered from Link to Windows 1.26082.130.0 and cross-checked against
// Phone Link 1.26072.257.0. Rendered by tools/catalog/render_protos.py from a descriptor set.
syntax = "proto3";

package side_channel.v1;

import "side_channel/v1/error.proto";
import "side_channel/v1/trace_context.proto";
import "side_channel/v1/wake.proto";
import "side_channel/v1/capability.proto";
import "side_channel/v1/authorization.proto";
import "side_channel/v1/hotspot.proto";

message SideChannelClientRequest {
  SideChannelTraceContext context = 1;
  optional SideChannelAuthorization authorization = 4;
  oneof request {
    SideChannelWakeRequest wake_request = 2;
    SideChannelCapabilityRequest capability_request = 3;
    SideChannelHotspotRequest hotspot_request = 5;
    SideChannelInstantHotspotRequest instant_hotspot_request = 6;
  }
}

message SideChannelServerResponse {
  bool ok = 1;
  SideChannelError error = 2;
  optional SideChannelAuthorization authorization = 6;
  SideChannelTraceContext context = 7;
  oneof response {
    SideChannelWakeResponse wake_response = 3;
    SideChannelCapabilityResponse capability_response = 4;
    SideChannelHotspotResponse hotspot_response = 5;
    SideChannelHotspotEncryptedResponse hotspot_encrypted_response = 8;
    SideChannelInstantHotspotResponse instant_hotspot_response = 9;
    SideChannelInstantHotspotEncryptedResponse instant_hotspot_encrypted_response = 10;
  }
}

message SideChannelServerMessage {
  oneof body {
    SideChannelServerResponse request_response = 1;
  }
}
