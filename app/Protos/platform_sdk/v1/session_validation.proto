// Wire schema used by Phone Link and Link to Windows.
// Field names and numbers recovered from Link to Windows 1.26082.130.0 and cross-checked against
// Phone Link 1.26072.257.0. Rendered by tools/catalog/render_protos.py from a descriptor set.
syntax = "proto3";

package platform_sdk.v1;

enum ProtoPlatformCapabilities {
  PROTO_PLATFORM_CAPABILITIES_UNSPECIFIED = 0;
  PROTO_PLATFORM_CAPABILITIES_SESSION_VALIDATION = 1;
  PROTO_PLATFORM_CAPABILITIES_PERSISTENT_MESSAGE_CHANNEL = 2;
  PROTO_PLATFORM_CAPABILITIES_NANO_TRANSPORT_PREFERENCE = 3;
}

message ProtoPlatformSessionValidationRequest {
  repeated ProtoPlatformCapabilities platform_capabilities = 1;
}

message ProtoPlatformSessionValidationResponse {
  repeated ProtoPlatformCapabilities platform_capabilities = 1;
  int32 persistent_messaging_channel_version = 2;
  int32 nano_transport_preference_version = 3;
}
