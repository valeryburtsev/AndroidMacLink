// Wire schema used by Phone Link and Link to Windows.
// Field names and numbers recovered from Link to Windows 1.26082.130.0 and cross-checked against
// Phone Link 1.26072.257.0. Rendered by tools/catalog/render_protos.py from a descriptor set.
syntax = "proto3";

package phone_mirroring.v1;

message LaunchCustomIntentMessage {
  string intent_key = 1;
}

message LaunchNotificationMessage {
  string key = 1;
  int32 action_index = 2;
}

message LaunchNotificationMessageV2 {
  string transaction_id = 1;
  string key = 2;
  int32 action_index = 3;
}

message RequestSessionResultMessage {
  string session_id = 1;
  string transaction_id = 2;
  bool session_already_exists = 3;
  int32 target_screen_layout = 4;
}

message LaunchNotificationResultMessage {
  optional string transaction_id = 1;
  optional string key = 2;
  optional int32 launch_result = 3;
}

message RequestSessionMessage {
  optional string package_name = 1;
  optional string transaction_id = 2;
}
