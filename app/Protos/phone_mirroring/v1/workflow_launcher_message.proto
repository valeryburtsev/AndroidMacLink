// Wire schema used by Phone Link and Link to Windows.
// Field names and numbers recovered from Link to Windows 1.26082.130.0 and cross-checked against
// Phone Link 1.26072.257.0. Rendered by tools/catalog/render_protos.py from a descriptor set.
syntax = "proto3";

package phone_mirroring.v1;

enum WorkflowType {
  WORKFLOW_TYPE_EARLY_LAUNCH = 0;
  WORKFLOW_TYPE_NEARBY = 1;
  WORKFLOW_TYPE_PERMISSION = 2;
  WORKFLOW_TYPE_APP_REMOTING = 3;
}

message WorkflowLaunchMessage {
  WorkflowType workflow_type = 1;
}

message WorkflowLaunchResultMessage {
  WorkflowType workflow_type = 1;
}
