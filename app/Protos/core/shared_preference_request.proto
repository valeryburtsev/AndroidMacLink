// Wire schema used by Phone Link and Link to Windows.
// Field names and numbers recovered from Link to Windows 1.26082.130.0 and cross-checked against
// Phone Link 1.26072.257.0. Rendered by tools/catalog/render_protos.py from a descriptor set.
syntax = "proto3";

package proto.core;

message SharedPreferenceReadRequest {
  string sharedPreferenceName = 1;
  string sharedPreferenceKey = 2;
  string resultBundleKey = 3;
  oneof defaultValue {
    bool defaultValueBool = 4;
    int32 defaultValueInt = 5;
    int64 defaultValueLong = 6;
    string defaultValueString = 7;
  }
}

message SharedPreferenceWriteRequest {
  string sharedPreferenceName = 1;
  string sharedPreferenceKey = 2;
  oneof value {
    bool valueBool = 3;
    int32 valueInt = 4;
    int64 valueLong = 5;
    string valueString = 6;
  }
}
