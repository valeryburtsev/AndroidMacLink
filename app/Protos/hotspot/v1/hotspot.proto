// Wire schema used by Phone Link and Link to Windows.
// Field names and numbers recovered from Link to Windows 1.26082.130.0 and cross-checked against
// Phone Link 1.26072.257.0. Rendered by tools/catalog/render_protos.py from a descriptor set.
syntax = "proto3";

package hotspot.v1;

import "hotspot/v1/credentials.proto";
import "hotspot/v1/trace_context.proto";

enum HotspotRequestType {
  HOTSPOT_REQUEST_TYPE_UNSPECIFIED = 0;
  HOTSPOT_REQUEST_TYPE_CAPABLE_STATUS = 1;
  HOTSPOT_REQUEST_TYPE_ENCRYPTED_CREDENTIALS = 2;
}

enum HotspotResponseStatus {
  HOTSPOT_RESPONSE_STATUS_UNSPECIFIED = 0;
  HOTSPOT_RESPONSE_STATUS_SUCCESS = 1;
  HOTSPOT_RESPONSE_STATUS_ERROR_OTHER = 2;
  HOTSPOT_RESPONSE_STATUS_UNTRUSTED = 3;
  HOTSPOT_RESPONSE_STATUS_UNKNOWN_COMMAND = 4;
  HOTSPOT_RESPONSE_STATUS_NOT_HOTSPOT_CAPABLE = 5;
}

enum HotspotCapableStatus {
  HOTSPOT_CAPABLE_STATUS_UNSPECIFIED = 0;
  HOTSPOT_CAPABLE_STATUS_UNKNOWN = 1;
  HOTSPOT_CAPABLE_STATUS_SUPPORTED = 2;
  HOTSPOT_CAPABLE_STATUS_AIRPLANE_MODE = 3;
  HOTSPOT_CAPABLE_STATUS_BLOCKED_BY_POLICY = 4;
  HOTSPOT_CAPABLE_STATUS_DATA_NOT_ALLOWED = 5;
  HOTSPOT_CAPABLE_STATUS_DATA_SAVER_IS_ENABLED = 6;
  HOTSPOT_CAPABLE_STATUS_HOTSPOT_PASSWORD_NOT_SET = 7;
  HOTSPOT_CAPABLE_STATUS_NO_HOTSPOT_SUPPORT_ON_PHONE = 8;
  HOTSPOT_CAPABLE_STATUS_SIM_NOT_READY = 9;
  HOTSPOT_CAPABLE_STATUS_SMART_VIEW_IN_USE = 10;
  HOTSPOT_CAPABLE_STATUS_UNSUPPORTED_DATA_PLAN = 11;
  HOTSPOT_CAPABLE_STATUS_WIFI_DIRECT_IN_USE = 12;
  HOTSPOT_CAPABLE_STATUS_WIRELESS_DEX_IN_USE = 13;
  HOTSPOT_CAPABLE_STATUS_LINK_TO_WINDOWS_NOT_TURNED_ON = 14;
  HOTSPOT_CAPABLE_STATUS_BLUETOOTH_PERMISSION_NOT_GRANTED = 15;
  HOTSPOT_CAPABLE_STATUS_HOTSPOT_MANAGER_IS_NULL = 16;
  HOTSPOT_CAPABLE_STATUS_UNKNOWN_MAPPING = 17;
}

enum HotspotErrorType {
  HOTSPOT_ERROR_TYPE_UNSPECIFIED = 0;
  HOTSPOT_ERROR_TYPE_OTHER = 1;
  HOTSPOT_ERROR_TYPE_UNKNOWN_REQUEST_TYPE = 2;
  HOTSPOT_ERROR_TYPE_SCENARIO_SERVICE_ERROR = 3;
  HOTSPOT_ERROR_TYPE_CRYPTO_VALIDATION_ERROR = 4;
  HOTSPOT_ERROR_TYPE_CLIENT_INFO_MISSING = 5;
  HOTSPOT_ERROR_TYPE_CRYPTO_TRUST_ERROR = 6;
  HOTSPOT_ERROR_TYPE_CRYPTO_TRUST_TIMEOUT = 7;
}

message HotspotError {
  HotspotErrorType type = 1;
  string msg = 2;
  HotspotCapableStatus capable_status = 3;
}

message HotspotRequest {
  HotspotRequestType type = 1;
  HotspotTraceContext trace_context = 2;
}

message HotspotResponse {
  HotspotResponseStatus status = 1;
  HotspotRequestType type = 2;
  oneof payload {
    HotspotCapableStatus capable_status = 3;
    HotspotEncryptedCredentials encrypted_credentials = 4;
    HotspotError error = 5;
  }
}
