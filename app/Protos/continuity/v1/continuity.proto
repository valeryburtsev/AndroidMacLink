// Wire schema used by Phone Link and Link to Windows.
// Field names and numbers recovered from Link to Windows 1.26082.130.0 and cross-checked against
// Phone Link 1.26072.257.0. Rendered by tools/catalog/render_protos.py from a descriptor set.
syntax = "proto3";

package continuity.v1;

import "google/protobuf/timestamp.proto";
import "sync/v1/metadata.proto";

enum AppContextResponseStatus {
  APP_CONTEXT_RESPONSE_STATUS_UNSPECIFIED = 0;
  APP_CONTEXT_RESPONSE_STATUS_OK = 1;
  APP_CONTEXT_RESPONSE_STATUS_UNKNOWN_ERROR = 2;
  APP_CONTEXT_RESPONSE_STATUS_BAD_REQUEST = 3;
  APP_CONTEXT_RESPONSE_STATUS_NOT_FOUND = 4;
  APP_CONTEXT_RESPONSE_STATUS_SYNC_DISABLED = 5;
}

message AppContextMetadata {
  repeated sync.v1.SyncMetadata content = 1;
}

message AppContext {
  int64 id = 1;
  int64 checksum = 2;
  string context_id = 3;
  int64 task_id = 4;
  string type = 5;
  optional string team_id = 6;
  optional string intent_uri = 7;
  string app_id = 8;
  optional string title = 9;
  optional string web_link = 10;
  optional bytes preview = 11;
  optional string extras = 12;
  int64 create_time = 13;
  int64 last_updated_time = 14;
  int64 life_time = 15;
}

message AppContextCreateOrUpdate {
  AppContext item = 1;
}

message AppContextDelete {
  int64 id = 1;
}

message AppContextSync {
  oneof operation {
    AppContextCreateOrUpdate create_or_update = 1;
    AppContextDelete delete = 2;
  }
}

message AppContextResponseMessage {
  AppContextResponseStatus status = 1;
  AppContextMetadata metadata = 2;
  repeated AppContextSync items = 3;
}
