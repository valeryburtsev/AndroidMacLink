// Wire schema used by Phone Link and Link to Windows.
// Field names and numbers recovered from Link to Windows 1.26082.130.0 and cross-checked against
// Phone Link 1.26072.257.0. Rendered by tools/catalog/render_protos.py from a descriptor set.
syntax = "proto3";

package image.v1;

enum ImageSemanticSearchResultStatus {
  IMAGE_SEMANTIC_SEARCH_RESULT_STATUS_UNSPECIFIED = 0;
  IMAGE_SEMANTIC_SEARCH_RESULT_STATUS_SUCCESS = 1;
  IMAGE_SEMANTIC_SEARCH_RESULT_STATUS_FAILURE = 2;
  IMAGE_SEMANTIC_SEARCH_RESULT_STATUS_NO_PERMISSION = 3;
  IMAGE_SEMANTIC_SEARCH_RESULT_STATUS_IN_INDEXING = 4;
}

message ImageSemanticSearchRequest {
  string query = 1;
  int32 max_results = 2;
}

message ImageGetRequestMessage {
  oneof request {
    ImageSemanticSearchRequest semantic_search_request = 1;
  }
}

message ImageSemanticSearchItem {
  int64 image_id = 1;
  float score = 2;
}

message ImageSemanticSearchResponse {
  ImageSemanticSearchResultStatus status = 1;
  repeated ImageSemanticSearchItem items = 2;
}

message ImageGetResponseMessage {
  oneof response {
    ImageSemanticSearchResponse semantic_search_response = 1;
  }
}
