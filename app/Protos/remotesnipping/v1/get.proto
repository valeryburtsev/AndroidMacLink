// Wire schema used by Phone Link and Link to Windows.
// Field names and numbers recovered from Link to Windows 1.26082.130.0 and cross-checked against
// Phone Link 1.26072.257.0. Rendered by tools/catalog/render_protos.py from a descriptor set.
syntax = "proto3";

package remotesnipping.v1;

import "remotesnipping/v1/metadata.proto";

enum MediaRequestType {
  MEDIA_REQUEST_TYPE_UNSPECIFIED = 0;
  MEDIA_REQUEST_TYPE_CAPABILITIES = 1;
  MEDIA_REQUEST_TYPE_THUMBNAIL = 2;
  MEDIA_REQUEST_TYPE_PHOTO = 3;
}

enum MediaResponseStatus {
  MEDIA_RESPONSE_STATUS_UNSPECIFIED = 0;
  MEDIA_RESPONSE_STATUS_OK = 1;
  MEDIA_RESPONSE_STATUS_BAD_REQUEST = 2;
  MEDIA_RESPONSE_STATUS_NOT_FOUND = 3;
  MEDIA_RESPONSE_STATUS_MISSING_PERMISSIONS = 4;
  MEDIA_RESPONSE_STATUS_SYNC_DISABLED = 5;
}

enum MediaCapability {
  MEDIA_CAPABILITY_UNSPECIFIED = 0;
  MEDIA_CAPABILITY_NEW_MEDIA_NOTIFICATIONS = 1;
}

message MediaRequestMessage {
  MediaRequestType request_type = 1;
  optional int64 media_id = 2;
}

message MediaResponseMessage {
  repeated MediaCapability capabilities = 1;
  bool has_permissions = 2;
  MediaResponseStatus status = 3;
  optional MediaMetadata item = 4;
}
